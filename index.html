<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordena el cuento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zalando+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1fa4ff;--card:#fff;--ink:#14213d;--mute:#6b7a90;--tile:#f4f2ea;--line:#d9d5c6;--btn:#1fa4ff;--ok:#2bb673;--sky:#c6e8fb;--grass:#6cc04a;--org:#ffb347;--org2:#ff8a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b3a63;--card:#17212f;--ink:#f1f5fb;--mute:#9fb0c6;--tile:#232f40;--line:#3a4a60;--btn:#2aa7ff;--sky:#27506f;--grass:#3f8a34}}
:root[data-theme="dark"]{--bg:#0b3a63;--card:#17212f;--ink:#f1f5fb;--mute:#9fb0c6;--tile:#232f40;--line:#3a4a60;--btn:#2aa7ff;--sky:#27506f;--grass:#3f8a34}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Zalando Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600}
.phone{max-width:440px;margin:0 auto;min-height:100vh;background:var(--card);display:flex;flex-direction:column;padding:14px 20px 22px;box-sizing:border-box}
@media (min-width:520px){.phone{margin:20px auto;min-height:calc(100vh - 40px);border-radius:36px}}
.top{display:flex;align-items:center;justify-content:space-between;min-height:34px}
.top b{font-size:15px;color:var(--mute);font-weight:600}
.ib{border:0;background:none;color:var(--ink);font:inherit;font-size:22px;width:40px;height:40px;border-radius:20px;cursor:pointer}
.dots{display:flex;gap:10px;justify-content:center;margin:12px 0 6px}
.dot{width:38px;height:38px;border-radius:50%;background:var(--tile);border:2px solid transparent;display:grid;place-items:center;font-size:16px;color:var(--mute);font-weight:800}
.dot.on{border-color:var(--btn);color:var(--btn)}.dot.ok{background:var(--btn);color:#fff}
h1{font-size:30px;line-height:1.15;text-align:center;font-weight:800;margin:10px 0}
h2{font-size:21px;line-height:1.25;text-align:center;font-weight:800;margin:6px 0 10px}
.lead{text-align:center;color:var(--mute);font-size:18px;line-height:1.5;margin:0 0 12px}
.story{font-size:23px;line-height:1.55;letter-spacing:.01em;text-align:left;margin:8px 0;max-width:34ch}
.art{width:100%;max-width:300px;margin:6px auto;display:block}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--org2);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 0 0 10px #ffb34755;margin:10px auto;display:grid;place-items:center}
.main{margin-top:auto;border:0;height:58px;border-radius:29px;background:var(--btn);color:#fff;font:inherit;font-size:20px;font-weight:800;cursor:pointer;width:100%}
.main:disabled{opacity:.45}
.ghost{background:none;border:0;color:var(--btn);font:inherit;font-size:17px;font-weight:800;cursor:pointer;padding:12px;margin-top:6px}
button:focus-visible,.card:focus-visible,.slot:focus-visible{outline:3px solid var(--org2);outline-offset:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot,.card{background:var(--tile);border-radius:18px;padding:8px;position:relative;box-sizing:border-box}
.slot{border:2px dashed var(--line);min-height:128px;display:grid;place-items:center;cursor:pointer}
.slot.full{border:2px solid var(--ok);cursor:default}
.slot.hot{border-color:var(--btn);background:#1fa4ff22}
.num{position:absolute;top:6px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--mute);z-index:1}
.slot.full .num{background:var(--ok);color:#fff}
.mini svg{width:100%;display:block}
.mini p{margin:2px 4px 4px;font-size:14px;line-height:1.3;font-weight:800;text-align:center}
.tray{margin-top:14px;padding-top:12px;border-top:2px solid var(--tile)}
.card{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid transparent}
.card.sel{border-color:var(--btn);background:#1fa4ff22}
.card.drag{position:fixed;z-index:9;pointer-events:none;box-shadow:0 10px 24px #0004;opacity:.95}
.msg{min-height:26px;text-align:center;font-size:17px;font-weight:800;color:var(--mute);margin:8px 0 0}
.msg.good{color:var(--ok)}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.faces{display:flex;gap:6px;justify-content:center;margin:18px 0}.faces svg{width:68px}
.stars{font-size:44px;text-align:center;letter-spacing:6px;margin:6px 0}
.row{display:flex;gap:10px;margin-top:auto;flex-direction:column}
</style>
</head>
<body>
<main class="phone" id="app"></main>
<script>
var IDEAS=["Los tres cerditos construyen sus casas.","El lobo sopla y tira la casa de paja.","El lobo sopla y tira la casa de palos.","El lobo no puede con la casa de ladrillos."];
var TXT=["Había una vez tres cerditos. Cada uno hizo su casa: una de paja, otra de palos y otra de ladrillos.","Llegó el lobo y dijo: “¡Soplaré y soplaré!”. Sopló fuerte y la casa de paja se cayó.","El lobo fue a la casa de palos. Sopló y sopló, y la casa de palos también se cayó.","Los cerditos corrieron a la casa de ladrillos. El lobo sopló, pero no pudo tirarla. ¡Los tres cerditos se salvaron!"];
function eyes(x,y){return '<circle cx="'+(x-7)+'" cy="'+y+'" r="4.5" fill="#fff"/><circle cx="'+(x+7)+'" cy="'+y+'" r="4.5" fill="#fff"/><circle cx="'+(x-6)+'" cy="'+(y+1)+'" r="2.2" fill="#14213d"/><circle cx="'+(x+8)+'" cy="'+(y+1)+'" r="2.2" fill="#14213d"/><path d="M'+(x-5)+' '+(y+9)+'Q'+x+' '+(y+14)+' '+(x+5)+' '+(y+9)+'" stroke="#14213d" stroke-width="2" fill="none" stroke-linecap="round"/>'}
function faces(){var f=['<path d="M30 54C6 36 6 12 22 10 28 9 30 14 30 14S32 9 38 10C54 12 54 36 30 54Z" fill="#ff4a3d"/>'+eyes(30,28),'<path d="M30 8L54 52H6Z" fill="#ffc533"/>'+eyes(30,36),'<circle cx="30" cy="30" r="25" fill="#ff7a1a"/>'+eyes(30,26),'<g fill="#3d8bff"><circle cx="18" cy="18" r="14"/><circle cx="42" cy="18" r="14"/><circle cx="18" cy="42" r="14"/><circle cx="42" cy="42" r="14"/></g>'+eyes(30,26)];return '<div class="faces" aria-hidden="true">'+f.map(function(s){return '<svg viewBox="0 0 60 60">'+s+'</svg>'}).join('')+'</div>'}
function pig(x,y,s,sc){return '<g transform="translate('+x+' '+y+') scale('+s+')"><ellipse rx="30" ry="24" fill="#ffb3c1"/><path d="M-20-18L-14-34-5-21ZM20-18L14-34 5-21Z" fill="#ff8fa6"/><ellipse cy="4" rx="12" ry="9" fill="#ff8fa6"/><circle cx="-4" cy="4" r="1.8" fill="#14213d"/><circle cx="4" cy="4" r="1.8" fill="#14213d"/><circle cx="-13" cy="-7" r="3" fill="#14213d"/><circle cx="13" cy="-7" r="3" fill="#14213d"/>'+(sc?'<ellipse cy="17" rx="4" ry="3" fill="#14213d"/>':'<path d="M-6 16Q0 21 6 16" stroke="#14213d" stroke-width="2" fill="none" stroke-linecap="round"/>')+'</g>'}
function house(t,x,y,r,s){var c={s:['#f6c744','#e0a526'],w:['#b9794a','#7a4a25'],b:['#e4572e','#9c2f17']}[t];var d=t=='s'?'<path d="M-20-30L-14-8M-4-34L-2-6M10-30L14-8" stroke="#c98d12" stroke-width="3" stroke-linecap="round"/>':t=='w'?'<path d="M-14-40V0M0-40V0M14-40V0" stroke="#7a4a25" stroke-width="3"/>':'<path d="M-28-26H28M-28-13H28M-14-40V-26M14-26V-13M0-13V0" stroke="#ffd9c9" stroke-width="2"/>';return '<g transform="translate('+x+' '+y+') rotate('+r+') scale('+s+')"><rect x="-28" y="-44" width="56" height="44" rx="4" fill="'+c[0]+'"/>'+d+'<path d="M-34-42L0-72 34-42Z" fill="'+c[1]+'"/><rect x="-6" y="-18" width="12" height="18" rx="3" fill="#14213d" opacity=".7"/></g>'}
function wolf(x,y,s,b){return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="M-30 0Q-34-46 0-50Q34-46 30 0Z" fill="#8a7bd6"/><path d="M-24-40L-22-62-8-47ZM24-40L22-62 8-47Z" fill="#6a5bb8"/><circle cx="-10" cy="-30" r="7" fill="#fff"/><circle cx="10" cy="-30" r="7" fill="#fff"/><circle cx="-8" cy="-30" r="3" fill="#14213d"/><circle cx="12" cy="-30" r="3" fill="#14213d"/>'+(b?'<ellipse cy="-14" rx="6" ry="7" fill="#14213d"/><path d="M34-16h18M34-8h24M34-24h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>':'<path d="M-8-14Q0-8 8-14" stroke="#14213d" stroke-width="3" fill="none" stroke-linecap="round"/>')+'</g>'}
function scene(n){var g=[[house('s',60,166,0,.8),house('w',150,166,0,.8),house('b',240,166,0,.8),pig(60,188,.65),pig(150,188,.65),pig(240,188,.65)],[wolf(70,186,1,1),house('s',215,172,30,1),pig(258,190,.7,1)],[wolf(70,186,1,1),house('w',215,172,-28,1),pig(258,190,.7,1)],[wolf(62,188,.9,0),house('b',210,170,0,1.1),pig(172,194,.6),pig(210,194,.6),pig(248,194,.6)]][n].join('');return '<svg viewBox="0 0 300 220" aria-hidden="true"><defs><clipPath id="c"><circle cx="150" cy="108" r="104"/></clipPath></defs><circle cx="150" cy="108" r="104" style="fill:var(--sky)"/><g clip-path="url(#c)"><ellipse cx="150" cy="196" rx="130" ry="40" style="fill:var(--grass)"/></g><g fill="#fff" opacity=".9"><ellipse cx="85" cy="50" rx="26" ry="11"/><ellipse cx="105" cy="44" rx="18" ry="12"/><ellipse cx="215" cy="38" rx="22" ry="10"/></g>'+g+'</svg>'}
var S,app=document.getElementById('app');
function reset(){S={v:'home',i:0,placed:[null,null,null,null],tries:[0,0,0,0],first:0,sel:null,back:false,order:shuffle()}}
function shuffle(){var a;do{a=[0,1,2,3].sort(function(){return Math.random()-.5})}while(a.join()=='0,1,2,3');return a}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function stop(){try{speechSynthesis.cancel()}catch(e){}}
function dots(f){return '<div class="dots" aria-hidden="true">'+[0,1,2,3].map(function(k){var c=f(k);return '<div class="dot '+c+'">'+(c=='ok'?'✓':k+1)+'</div>'}).join('')+'</div>'}
function go(v){stop();S.v=v;render()}
function render(){
if(S.v=='home'){app.innerHTML='<div class="top"><span></span></div>'+faces()+'<h1>Ordena el cuento</h1><p class="lead">Lee una historia corta y ordena sus partes. ¡Solo 10 minutos!</p><button class="main" onclick="S.i=0;S.back=false;go(\'read\')">Empezar</button>'}
else if(S.v=='read'){var i=S.i,last=i==3;app.innerHTML='<div class="top"><button class="ib" aria-label="Atrás" onclick="'+(i?'S.i--;render();stop()':'go(S.back?\'order\':\'home\')')+'">‹</button><b>Los tres cerditos</b><button class="ib" aria-label="Cerrar" onclick="reset();go(\'home\')">✕</button></div>'+dots(function(k){return k<i?'ok':k==i?'on':''})+'<div class="art">'+scene(i)+'</div><p class="story">'+TXT[i]+'</p><button class="play" aria-label="Escuchar" onclick="say(TXT[S.i])">▶</button><button class="main" onclick="'+(last?'S.back=false;go(\'order\')':'S.i++;render();stop()')+'">'+(last?'Ordenar la historia':'Siguiente')+'</button>'}
else if(S.v=='order'){var done=S.placed.filter(function(x){return x!==null}).length;var pl=S.placed;
app.innerHTML='<div class="top"><button class="ib" aria-label="Releer el cuento" onclick="S.i=0;S.back=true;go(\'read\')">📖</button><b>Ordena la historia</b><button class="ib" aria-label="Cerrar" onclick="reset();go(\'home\')">✕</button></div>'+dots(function(k){return pl[k]!==null?'ok':''})+'<h2>¿Qué pasó primero? Arrastra o toca una tarjeta y luego su lugar.</h2><div class="grid" id="slots">'+[0,1,2,3].map(function(k){return '<div class="slot'+(pl[k]!==null?' full':'')+'" data-slot="'+k+'" tabindex="0" role="button" aria-label="Lugar '+(k+1)+'"><span class="num">'+(k+1)+'</span>'+(pl[k]!==null?'<div class="mini">'+scene(pl[k])+'<p>'+IDEAS[pl[k]]+'</p></div>':'')+'</div>'}).join('')+'</div><div class="msg" id="msg" aria-live="polite"></div><div class="tray"><div class="grid" id="tray">'+S.order.filter(function(id){return pl.indexOf(id)<0}).map(function(id){return '<div class="card'+(S.sel===id?' sel':'')+'" data-id="'+id+'" tabindex="0" role="button"><div class="mini">'+scene(id)+'<p>'+IDEAS[id]+'</p></div></div>'}).join('')+'</div></div>';bind()}
else{var st=S.first>=4?'★★★':S.first>=2?'★★☆':'★☆☆';app.innerHTML='<div class="top"><span></span></div>'+faces()+'<h1>¡Lo lograste!</h1><div class="stars" aria-label="'+st.split('★').length-1+' estrellas">'+st+'</div><p class="lead">Ordenaste '+S.first+' de 4 partes a la primera. ¡Cada intento cuenta!</p><div class="row"><button class="main" onclick="reset();go(\'order\')">Jugar otra vez</button><button class="ghost" onclick="reset();S.i=0;go(\'read\')">Leer el cuento de nuevo</button></div>'}}
function msg(t,g){var m=document.getElementById('msg');if(m){m.textContent=t;m.className='msg'+(g?' good':'')}}
function place(id,k){if(S.placed[k]!==null)return;if(id==k){S.placed[k]=id;if(S.tries[id]==0)S.first++;S.sel=null;render();msg('¡Muy bien!',1);if(S.placed.every(function(x){return x!==null}))setTimeout(function(){go('result')},900)}else{S.tries[id]++;var el=document.querySelector('[data-id="'+id+'"]');if(el){el.classList.add('shake');setTimeout(function(){el.classList.remove('shake')},400)}msg('Casi. Prueba en otro lugar.')}}
function bind(){
document.querySelectorAll('.slot').forEach(function(s){s.onclick=function(){if(S.sel!==null)place(S.sel,+s.dataset.slot)};s.onkeydown=function(e){if((e.key=='Enter'||e.key==' ')&&S.sel!==null){e.preventDefault();place(S.sel,+s.dataset.slot)}}});
document.querySelectorAll('.card').forEach(function(c){var id=+c.dataset.id,sx,sy,moved=false,ox,oy,w;
c.onkeydown=function(e){if(e.key=='Enter'||e.key==' '){e.preventDefault();S.sel=S.sel===id?null:id;render()}};
c.onpointerdown=function(e){sx=e.clientX;sy=e.clientY;moved=false;var r=c.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;w=r.width;c.setPointerCapture(e.pointerId)};
c.onpointermove=function(e){if(sx===undefined)return;if(!moved&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>8){moved=true;c.classList.add('drag');c.style.width=w+'px'}
if(moved){c.style.left=(e.clientX-ox)+'px';c.style.top=(e.clientY-oy)+'px';document.querySelectorAll('.slot').forEach(function(s){var r=s.getBoundingClientRect();s.classList.toggle('hot',e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom&&S.placed[+s.dataset.slot]===null)})}};
c.onpointerup=function(e){if(sx===undefined)return;sx=undefined;if(!moved){S.sel=S.sel===id?null:id;render();return}
var t=null;document.querySelectorAll('.slot').forEach(function(s){var r=s.getBoundingClientRect();if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)t=+s.dataset.slot});
c.classList.remove('drag');c.style.left=c.style.top=c.style.width='';document.querySelectorAll('.slot').forEach(function(s){s.classList.remove('hot')});
if(t!==null)place(id,t)};
c.onpointercancel=function(){sx=undefined;c.classList.remove('drag');c.style.left=c.style.top=c.style.width=''}})}
reset();render();
</script>
</body>
</html>
